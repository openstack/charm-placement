[DEFAULT]
debug = {{ options.debug }}
use_syslog = true

[api]
auth_strategy = keystone

{% if shared_db.host -%}
[placement_database]
connection = {{ shared_db.get_uri(prefix='placement') }}
{%- endif %}

{% include "parts/section-keystone-authtoken" %}

[placement]
randomize_allocation_candidates = true
{%- if options.render_generation_strategy %}
allocation_candidates_generation_strategy = {{ options.render_generation_strategy }}
{%- endif %}
{%- if options.render_wide_provider_trees %}

[workarounds]
optimize_for_wide_provider_trees = true
{%- endif %}
